name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CarbonBill.sln

      - name: Build solution
        run: dotnet build CarbonBill.sln --no-restore -c Release

      - name: Run Architecture & Unit Tests
        run: dotnet test CarbonBill.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

  frontend-build:
    name: Frontend Build & Bundle Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build PWA bundle
        working-directory: ./web
        run: npm run build
