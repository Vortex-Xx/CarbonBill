version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carbonbill-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/data/carbonbill.db;Cache=Shared
      - ConnectionStrings__HangfireConnection=Data Source=/data/hangfire.db;Cache=Shared
      - Jwt__Key=${JWT_SECRET_KEY:-CarbonBill-ProductionSecretKey-ChangeInEnv-MustBe32BytesLong!}
      - Jwt__Issuer=CarbonBill
      - Jwt__Audience=CarbonBillClients
    volumes:
      - carbonbill-data:/data
    networks:
      - carbonbill-net
    expose:
      - "5000"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carbonbill-worker
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/carbonbill.db;Cache=Shared
      - ConnectionStrings__HangfireConnection=Data Source=/data/hangfire.db;Cache=Shared
      - HANGFIRE_WORKER_ONLY=true
    volumes:
      - carbonbill-data:/data
    networks:
      - carbonbill-net
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: carbonbill-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - carbonbill-net
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: carbonbill-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=carbonbill
      - POSTGRES_USER=carbonbill
      - POSTGRES_PASSWORD=carbonbill_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - carbonbill-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonbill -d carbonbill"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: carbonbill-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - carbonbill-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carbonbill-data:
    name: carbonbill-data
  postgres-data:
    name: carbonbill-postgres-data
  minio-data:
    name: carbonbill-minio-data
  caddy-data:
  caddy-config:

networks:
  carbonbill-net:
    driver: bridge
